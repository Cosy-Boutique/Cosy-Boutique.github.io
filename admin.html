<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosy Boutique — Espace Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --white-pure: #FFFFFF;
        --white-soft: #FAF8F6;
        --pink-soft: #D4A5A5;
        --pink-dark: #c49494;
        --pink-pale: #F5E9E6;
        --green-soft: #A8C4A0;
        --green-dark: #7fa375;
        --gold-bead: #C9A24A;
        --text-dark: #1A1A1A;
        --text-light: #8A8A8A;
        --border-light: #EEEEEE;
        --card-bg: #FFFFFF;
        --page-bg: var(--white-soft);
        --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
        --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
        --radius-card: 16px;
        --radius-btn: 40px;
        --status-nouvelle-bg: #FDECEC; --status-nouvelle-fg: #c0392b;
        --status-en_cours-bg: #FEF6E0; --status-en_cours-fg: #b8860b;
        --status-validee-bg: #E6F4EA; --status-validee-fg: #2e7d32;
        --status-livree-bg: #E8EAF6; --status-livree-fg: #3949ab;
    }

    [data-theme="dark"] {
        --white-pure: #23201E;
        --white-soft: #1A1817;
        --pink-pale: #3A2C2C;
        --text-dark: #F2EEEA;
        --text-light: #A69C97;
        --border-light: #33302E;
        --card-bg: #23201E;
        --page-bg: #17151400;
        --shadow-sm: 0 4px 14px rgba(0,0,0,0.35);
        --shadow-md: 0 10px 28px rgba(0,0,0,0.5);
        --status-nouvelle-bg: #3a2222; --status-nouvelle-fg: #ef8888;
        --status-en_cours-bg: #3a3220; --status-en_cours-fg: #e0bb5c;
        --status-validee-bg: #223a29; --status-validee-fg: #7fce93;
        --status-livree-bg: #232a3a; --status-livree-fg: #93a4e0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: var(--white-soft);
        color: var(--text-dark);
        min-height: 100vh;
        transition: background 0.25s, color 0.25s;
    }

    /* ===== LOGIN ===== */
    #loginScreen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .login-box {
        background: var(--card-bg);
        padding: 40px 32px;
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-md);
        max-width: 360px;
        width: 100%;
        text-align: center;
    }
    .login-logo {
        width: 52px;
        height: 52px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: var(--pink-pale);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--pink-dark);
        font-size: 20px;
    }
    .login-box h1 {
        font-family: 'Playfair Display', serif;
        font-size: 24px;
        margin-bottom: 6px;
        color: var(--text-dark);
    }
    .login-box p {
        color: var(--text-light);
        font-size: 13px;
        margin-bottom: 24px;
    }
    .login-box input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border-light);
        border-radius: 12px;
        margin-bottom: 12px;
        font-size: 14px;
        font-family: inherit;
        background: var(--white-soft);
        color: var(--text-dark);
    }
    .login-box input:focus { outline: 2px solid var(--pink-soft); }
    .login-box button {
        width: 100%;
        padding: 13px;
        background: var(--pink-soft);
        color: white;
        border: none;
        border-radius: var(--radius-btn);
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        margin-top: 6px;
        transition: background 0.2s;
    }
    .login-box button:hover { background: var(--pink-dark); }
    .login-error {
        color: #c0392b;
        font-size: 12.5px;
        margin-top: 10px;
        min-height: 16px;
    }

    /* ===== DASHBOARD ===== */
    #dashboard { display: none; }
    header {
        background: var(--card-bg);
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--border-light);
        position: sticky;
        top: 0;
        z-index: 20;
        flex-wrap: wrap;
    }
    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .header-logo {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--pink-pale);
        color: var(--pink-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        flex-shrink: 0;
    }
    header h1 {
        font-family: 'Playfair Display', serif;
        font-size: 18px;
        line-height: 1.2;
    }
    header h1 span {
        display: block;
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-light);
        margin-top: 1px;
    }

    .search-box {
        position: relative;
        flex: 1;
        min-width: 180px;
        max-width: 320px;
    }
    .search-box i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-light);
        font-size: 13px;
    }
    .search-box input {
        width: 100%;
        padding: 9px 12px 9px 34px;
        border-radius: 20px;
        border: 1px solid var(--border-light);
        font-family: inherit;
        font-size: 13px;
        background: var(--white-soft);
        color: var(--text-dark);
    }
    .search-box input:focus { outline: 2px solid var(--pink-soft); }

    .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--text-light);
    }
    .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 1px solid var(--border-light);
        background: var(--card-bg);
        color: var(--text-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 13px;
        flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--white-soft); }
    .country-pill {
        background: var(--pink-pale);
        color: var(--pink-dark);
        padding: 6px 14px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 12px;
        white-space: nowrap;
    }
    #logoutBtn {
        background: none;
        border: 1px solid var(--border-light);
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 12.5px;
        font-family: inherit;
        color: var(--text-dark);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    #logoutBtn:hover { background: var(--white-soft); }

    main {
        max-width: 960px;
        margin: 0 auto;
        padding: 24px 16px 60px;
    }

    /* ===== STATS ===== */
    .stats-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 16px;
    }
    .stat-card {
        background: var(--card-bg);
        border-radius: var(--radius-card);
        padding: 16px 14px;
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .stat-card .stat-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
        flex-shrink: 0;
    }
    .stat-card:nth-child(1) .stat-icon { background: var(--pink-pale); color: var(--pink-dark); }
    .stat-card:nth-child(2) .stat-icon { background: var(--status-nouvelle-bg); color: var(--status-nouvelle-fg); }
    .stat-card:nth-child(3) .stat-icon { background: var(--status-en_cours-bg); color: var(--status-en_cours-fg); }
    .stat-card:nth-child(4) .stat-icon { background: var(--status-validee-bg); color: var(--status-validee-fg); }
    .stat-card .num { font-size: 19px; font-weight: 700; line-height: 1.1; }
    .stat-card .label { font-size: 11px; color: var(--text-light); margin-top: 2px; }

    /* ===== MINI CHART ===== */
    .chart-card {
        background: var(--card-bg);
        border-radius: var(--radius-card);
        padding: 18px 20px 14px;
        box-shadow: var(--shadow-sm);
        margin-bottom: 24px;
    }
    .chart-card-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 14px;
    }
    .chart-card-head h2 {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-dark);
    }
    .chart-card-head span {
        font-size: 11px;
        color: var(--text-light);
    }
    .chart-bars {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 70px;
    }
    .chart-bar-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        height: 100%;
        gap: 6px;
    }
    .chart-bar {
        width: 100%;
        max-width: 26px;
        border-radius: 6px 6px 3px 3px;
        background: var(--pink-pale);
        min-height: 4px;
        transition: height 0.3s;
        position: relative;
    }
    .chart-bar.has-orders { background: var(--pink-soft); }
    .chart-bar-label {
        font-size: 10px;
        color: var(--text-light);
    }

    /* ===== TOOLBAR ===== */
    .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
        flex-wrap: wrap;
    }
    .filter-tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    .filter-tab {
        padding: 8px 14px;
        border-radius: 20px;
        border: 1px solid var(--border-light);
        background: var(--card-bg);
        font-size: 12.5px;
        font-family: inherit;
        cursor: pointer;
        color: var(--text-light);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .filter-tab.active {
        background: var(--pink-soft);
        color: white;
        border-color: var(--pink-soft);
    }
    .sort-select {
        padding: 8px 14px;
        border-radius: 20px;
        border: 1px solid var(--border-light);
        background: var(--card-bg);
        color: var(--text-dark);
        font-family: inherit;
        font-size: 12.5px;
        cursor: pointer;
    }

    /* ===== BULK ACTION BAR ===== */
    .bulk-bar {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: var(--text-dark);
        color: var(--white-pure);
        padding: 10px 16px;
        border-radius: 14px;
        margin-bottom: 14px;
        font-size: 12.5px;
        flex-wrap: wrap;
    }
    .bulk-bar.show { display: flex; }
    .bulk-bar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .bulk-bar button {
        background: rgba(255,255,255,0.12);
        color: white;
        border: none;
        padding: 7px 12px;
        border-radius: 16px;
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
    }
    .bulk-bar button:hover { background: rgba(255,255,255,0.22); }
    .bulk-bar .clear-selection { background: none; text-decoration: underline; padding: 7px 4px; }

    /* ===== ORDER CARD ===== */
    .order-card {
        background: var(--card-bg);
        border-radius: var(--radius-card);
        padding: 16px 18px;
        margin-bottom: 12px;
        box-shadow: var(--shadow-sm);
        display: flex;
        gap: 12px;
        transition: box-shadow 0.2s;
    }
    .order-card.selected { box-shadow: 0 0 0 2px var(--pink-soft), var(--shadow-sm); }
    .order-checkbox {
        margin-top: 4px;
        width: 17px;
        height: 17px;
        accent-color: var(--pink-soft);
        cursor: pointer;
        flex-shrink: 0;
    }
    .order-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--pink-pale);
        color: var(--pink-dark);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        flex-shrink: 0;
    }
    .order-body { flex: 1; min-width: 0; }
    .order-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 8px;
        flex-wrap: wrap;
    }
    .order-customer { font-weight: 600; font-size: 14.5px; }
    .order-date { font-size: 11px; color: var(--text-light); margin-top: 2px; }
    .status-badge {
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .status-nouvelle { background: var(--status-nouvelle-bg); color: var(--status-nouvelle-fg); }
    .status-en_cours { background: var(--status-en_cours-bg); color: var(--status-en_cours-fg); }
    .status-validee { background: var(--status-validee-bg); color: var(--status-validee-fg); }
    .status-livree { background: var(--status-livree-bg); color: var(--status-livree-fg); }

    .order-details {
        font-size: 12.5px;
        color: var(--text-dark);
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
    }
    .order-details div { display: flex; align-items: baseline; gap: 7px; }
    .order-details i { color: var(--text-light); width: 13px; font-size: 11px; }
    .order-items {
        background: var(--white-soft);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 12.5px;
        margin-bottom: 12px;
    }
    .order-items div { padding: 2px 0; }
    .item-category {
        color: var(--pink-dark);
        font-weight: 600;
        font-size: 11.5px;
    }
    .order-subtotal { font-weight: 600; margin-top: 6px; }

    .order-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
    }
    .order-actions select {
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--border-light);
        font-family: inherit;
        font-size: 12.5px;
        background: var(--card-bg);
        color: var(--text-dark);
    }
    .btn-confirm-wa {
        background: var(--green-soft);
        color: white;
        border: none;
        padding: 9px 16px;
        border-radius: 20px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }
    .btn-confirm-wa:hover { opacity: 0.9; }
    .btn-ready-wa { background: var(--gold-bead); }
    .already-sent {
        font-size: 12px;
        color: var(--text-light);
        font-style: italic;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-light);
        font-size: 14px;
    }
    .empty-state i {
        font-size: 30px;
        color: var(--pink-pale);
        margin-bottom: 12px;
        display: block;
    }

    @media (max-width: 640px) {
        .stats-row { grid-template-columns: repeat(2, 1fr); }
        .search-box { order: 3; max-width: none; flex-basis: 100%; }
    }
</style>
</head>
<body>

<!-- ÉCRAN DE CONNEXION -->
<div id="loginScreen">
    <div class="login-box">
        <div class="login-logo"><i class="fas fa-gem"></i></div>
        <h1>Cosy Boutique</h1>
        <p>Espace admin — connecte-toi pour voir tes commandes</p>
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Mot de passe">
        <button id="loginBtn">Se connecter</button>
        <div class="login-error" id="loginError"></div>
    </div>
</div>

<!-- TABLEAU DE BORD -->
<div id="dashboard">
    <header>
        <div class="header-left">
            <div class="header-logo"><i class="fas fa-gem"></i></div>
            <h1>Cosy Boutique<span>Commandes</span></h1>
        </div>
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Chercher par nom ou téléphone...">
        </div>
        <div class="header-right">
            <span class="country-pill" id="countryPill">—</span>
            <button class="icon-btn" id="themeToggleBtn" title="Changer de thème"><i class="fas fa-moon"></i></button>
            <button id="logoutBtn"><i class="fas fa-arrow-right-from-bracket"></i> Déconnexion</button>
        </div>
    </header>
    <main>
        <div class="stats-row" id="statsRow"></div>

        <div class="chart-card">
            <div class="chart-card-head">
                <h2>Commandes des 7 derniers jours</h2>
                <span id="chartTotal"></span>
            </div>
            <div class="chart-bars" id="chartBars"></div>
        </div>

        <div class="bulk-bar" id="bulkBar">
            <span id="bulkCount">0 sélectionnée(s)</span>
            <div class="bulk-bar-actions">
                <button onclick="bulkUpdateStatus('en_cours')"><i class="fas fa-hourglass-half"></i> En cours</button>
                <button onclick="bulkUpdateStatus('validee')"><i class="fas fa-box"></i> Prête</button>
                <button onclick="bulkUpdateStatus('livree')"><i class="fas fa-circle-check"></i> Livrée</button>
                <button class="clear-selection" onclick="clearSelection()">Tout désélectionner</button>
            </div>
        </div>

        <div class="toolbar">
            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" data-status="all"><i class="fas fa-layer-group"></i> Toutes</button>
                <button class="filter-tab" data-status="nouvelle"><i class="fas fa-circle-plus"></i> Nouvelles</button>
                <button class="filter-tab" data-status="en_cours"><i class="fas fa-hourglass-half"></i> En cours</button>
                <button class="filter-tab" data-status="validee"><i class="fas fa-box"></i> Prêtes</button>
                <button class="filter-tab" data-status="livree"><i class="fas fa-circle-check"></i> Livrées</button>
            </div>
            <select class="sort-select" id="sortSelect">
                <option value="date_desc">Plus récentes</option>
                <option value="date_asc">Plus anciennes</option>
                <option value="amount_desc">Montant décroissant</option>
                <option value="amount_asc">Montant croissant</option>
            </select>
        </div>

        <div id="ordersList"></div>
    </main>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://zshgffgllvbllqxrkhyl.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpzaGdmZmdsbHZibGxxeHJraHlsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODc3OTQsImV4cCI6MjEwMjA2Mzc5NH0._nRd3D4syc0OikNoTCn6rdOtxL112ORbfphVsZG-s5s";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentOrders = [];
    let currentFilter = 'all';
    let currentSort = 'date_desc';
    let searchQuery = '';
    let adminCountry = null;
    let selectedIds = new Set();

    const STATUS_LABELS = {
        nouvelle: '<i class="fas fa-circle-plus"></i> Nouvelle',
        en_cours: '<i class="fas fa-hourglass-half"></i> En cours',
        validee: '<i class="fas fa-box"></i> Prête',
        livree: '<i class="fas fa-circle-check"></i> Livrée'
    };

    const COUNTRY_LABELS = {
        tunisia: "🇹🇳 Tunisie",
        kinshasa: "🇨🇩 Kinshasa"
    };

    // ============================================
    // THÈME (clair / sombre)
    // ============================================
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        document.getElementById('themeToggleBtn').innerHTML = theme === 'dark'
            ? '<i class="fas fa-sun"></i>'
            : '<i class="fas fa-moon"></i>';
        localStorage.setItem('cosyAdminTheme', theme);
    }
    (function initTheme() {
        const saved = localStorage.getItem('cosyAdminTheme') || 'light';
        applyTheme(saved);
    })();
    document.getElementById('themeToggleBtn').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    // ============================================
    // CONNEXION
    // ============================================
    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('loginPassword').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') login();
    });

    async function login() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errorEl = document.getElementById('loginError');
        errorEl.textContent = "";

        if (!email || !password) {
            errorEl.textContent = "Merci de remplir email et mot de passe";
            return;
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
            errorEl.textContent = "Email ou mot de passe incorrect";
            return;
        }
        await initDashboard();
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        location.reload();
    });

    // ============================================
    // DASHBOARD
    // ============================================
    async function initDashboard() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) return;

        const { data: adminRow, error: adminError } = await supabaseClient
            .from('admins')
            .select('country')
            .eq('id', user.id)
            .single();

        if (adminError || !adminRow) {
            document.getElementById('loginError').textContent = "Ce compte n'est pas encore relié à un pays. Contacte l'administrateur du site.";
            await supabaseClient.auth.signOut();
            return;
        }

        adminCountry = adminRow.country;
        document.getElementById('countryPill').textContent = COUNTRY_LABELS[adminCountry] || adminCountry;

        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';

        await loadOrders();
    }

    async function loadOrders() {
        const { data, error } = await supabaseClient
            .from('orders')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error(error);
            return;
        }
        currentOrders = data || [];
        renderStats();
        renderChart();
        renderOrders();
    }

    function renderStats() {
        const counts = { nouvelle: 0, en_cours: 0, validee: 0, livree: 0 };
        currentOrders.forEach(o => { if (counts[o.status] !== undefined) counts[o.status]++; });

        document.getElementById('statsRow').innerHTML = `
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-layer-group"></i></div>
                <div><div class="num">${currentOrders.length}</div><div class="label">Total</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-circle-plus"></i></div>
                <div><div class="num">${counts.nouvelle}</div><div class="label">Nouvelles</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-hourglass-half"></i></div>
                <div><div class="num">${counts.en_cours}</div><div class="label">En cours</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fas fa-box"></i></div>
                <div><div class="num">${counts.validee}</div><div class="label">Prêtes</div></div>
            </div>
        `;
    }

    // ============================================
    // MINI GRAPHIQUE — 7 DERNIERS JOURS
    // ============================================
    function renderChart() {
        const days = [];
        const today = new Date();
        for (let i = 6; i >= 0; i--) {
            const d = new Date(today);
            d.setDate(d.getDate() - i);
            days.push(d);
        }

        const countsByDay = days.map(d => {
            const dayStr = d.toDateString();
            return currentOrders.filter(o => new Date(o.created_at).toDateString() === dayStr).length;
        });

        const max = Math.max(...countsByDay, 1);
        const total = countsByDay.reduce((a, b) => a + b, 0);
        document.getElementById('chartTotal').textContent = `${total} commande${total !== 1 ? 's' : ''}`;

        document.getElementById('chartBars').innerHTML = days.map((d, i) => {
            const heightPct = Math.max((countsByDay[i] / max) * 100, 4);
            const label = d.toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', '');
            return `
                <div class="chart-bar-col" title="${countsByDay[i]} commande(s) le ${d.toLocaleDateString('fr-FR')}">
                    <div class="chart-bar ${countsByDay[i] > 0 ? 'has-orders' : ''}" style="height: ${heightPct}%"></div>
                    <div class="chart-bar-label">${label}</div>
                </div>
            `;
        }).join('');
    }

    // ============================================
    // RECHERCHE & TRI
    // ============================================
    document.getElementById('searchInput').addEventListener('input', (e) => {
        searchQuery = e.target.value.trim().toLowerCase();
        renderOrders();
    });
    document.getElementById('sortSelect').addEventListener('change', (e) => {
        currentSort = e.target.value;
        renderOrders();
    });

    function getInitials(name) {
        return (name || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0]?.toUpperCase() || '').join('');
    }

    function renderOrders() {
        const list = document.getElementById('ordersList');

        let filtered = currentFilter === 'all'
            ? [...currentOrders]
            : currentOrders.filter(o => o.status === currentFilter);

        if (searchQuery) {
            filtered = filtered.filter(o =>
                (o.customer_name || '').toLowerCase().includes(searchQuery) ||
                (o.customer_phone || '').toLowerCase().includes(searchQuery)
            );
        }

        filtered.sort((a, b) => {
            if (currentSort === 'date_desc') return new Date(b.created_at) - new Date(a.created_at);
            if (currentSort === 'date_asc') return new Date(a.created_at) - new Date(b.created_at);
            if (currentSort === 'amount_desc') return Number(b.subtotal) - Number(a.subtotal);
            if (currentSort === 'amount_asc') return Number(a.subtotal) - Number(b.subtotal);
            return 0;
        });

        if (filtered.length === 0) {
            list.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i>Aucune commande ici pour le moment</div>`;
            updateBulkBar();
            return;
        }

        list.innerHTML = filtered.map(order => {
            const date = new Date(order.created_at).toLocaleString('fr-FR', {
                day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
            });
            const itemsHtml = (order.items || []).map(item => `
                <div>
                    ${item.name}${item.category ? ` <span class="item-category">· ${item.category}</span>` : ''} × ${item.quantity} — ${(item.price * item.quantity).toFixed(2)} ${order.currency}
                </div>
            `).join('');
            const isSelected = selectedIds.has(order.id);

            return `
                <div class="order-card ${isSelected ? 'selected' : ''}">
                    <input type="checkbox" class="order-checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelect('${order.id}')">
                    <div class="order-avatar">${getInitials(order.customer_name)}</div>
                    <div class="order-body">
                        <div class="order-top">
                            <div>
                                <div class="order-customer">${order.customer_name}</div>
                                <div class="order-date">${date}</div>
                            </div>
                            <span class="status-badge status-${order.status}">${STATUS_LABELS[order.status] || order.status}</span>
                        </div>
                        <div class="order-details">
                            <div><i class="fas fa-phone"></i> ${order.customer_phone}</div>
                            <div><i class="fas fa-location-dot"></i> ${order.customer_city || '—'} · ${order.customer_address || '—'}</div>
                            ${order.customer_notes ? `<div><i class="fas fa-note-sticky"></i> ${order.customer_notes}</div>` : ''}
                        </div>
                        <div class="order-items">
                            ${itemsHtml}
                            <div class="order-subtotal">Sous-total : ${Number(order.subtotal).toFixed(2)} ${order.currency}</div>
                        </div>
                        <div class="order-actions">
                            <select onchange="updateStatus('${order.id}', this.value)">
                                <option value="nouvelle" ${order.status === 'nouvelle' ? 'selected' : ''}>Nouvelle</option>
                                <option value="en_cours" ${order.status === 'en_cours' ? 'selected' : ''}>En cours</option>
                                <option value="validee" ${order.status === 'validee' ? 'selected' : ''}>Prête</option>
                                <option value="livree" ${order.status === 'livree' ? 'selected' : ''}>Livrée</option>
                            </select>
                            ${actionButtonHtml(order)}
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        updateBulkBar();
    }

    async function updateStatus(orderId, newStatus) {
        const { error } = await supabaseClient
            .from('orders')
            .update({ status: newStatus, updated_at: new Date().toISOString() })
            .eq('id', orderId);

        if (error) {
            alert("Erreur lors de la mise à jour du statut");
            return;
        }
        await loadOrders();
    }

    // Choisit le bouton WhatsApp à afficher selon l'étape de la commande
    function actionButtonHtml(order) {
        if (order.status === 'nouvelle') {
            return `<button class="btn-confirm-wa" onclick="sendConfirmation('${order.id}')"><i class="fab fa-whatsapp"></i> Confirmer réception</button>`;
        }
        if (order.status === 'en_cours') {
            return `<button class="btn-confirm-wa btn-ready-wa" onclick="sendReadyMessage('${order.id}')"><i class="fab fa-whatsapp"></i> Commande prête</button>`;
        }
        return `<span class="already-sent"><i class="fas fa-check"></i> Messages envoyés</span>`;
    }

    function sendConfirmation(orderId) {
        const order = currentOrders.find(o => o.id === orderId);
        if (!order) return;

        const message = `Bonjour ${order.customer_name} 👋\n\n` +
            `Merci pour votre commande chez Cosy Boutique 🌸\n` +
            `Nous sommes en train de la préparer avec soin.\n\n` +
            `📦 Délai de livraison estimé : 3 à 4 jours\n\n` +
            `Nous vous recontactons dès que votre colis est en route. Merci de votre confiance 💛`;

        if (order.status === 'nouvelle') {
            updateStatus(orderId, 'en_cours');
        }

        window.open(`https://wa.me/${order.customer_phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(message)}`, '_blank');
    }

    function sendReadyMessage(orderId) {
        const order = currentOrders.find(o => o.id === orderId);
        if (!order) return;

        const message = `Bonjour ${order.customer_name} 👋\n\n` +
            `Bonne nouvelle : votre commande chez Cosy Boutique est prête 🎉\n` +
            `Elle sera livrée très prochainement.\n\n` +
            `Merci pour votre confiance 💛`;

        if (order.status === 'en_cours') {
            updateStatus(orderId, 'validee');
        }

        window.open(`https://wa.me/${order.customer_phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(message)}`, '_blank');
    }

    // ============================================
    // SÉLECTION MULTIPLE
    // ============================================
    function toggleSelect(orderId) {
        if (selectedIds.has(orderId)) selectedIds.delete(orderId);
        else selectedIds.add(orderId);
        renderOrders();
    }

    function clearSelection() {
        selectedIds.clear();
        renderOrders();
    }

    function updateBulkBar() {
        const bar = document.getElementById('bulkBar');
        const count = selectedIds.size;
        if (count === 0) {
            bar.classList.remove('show');
            return;
        }
        bar.classList.add('show');
        document.getElementById('bulkCount').textContent = `${count} commande${count > 1 ? 's' : ''} sélectionnée${count > 1 ? 's' : ''}`;
    }

    async function bulkUpdateStatus(newStatus) {
        const ids = Array.from(selectedIds);
        if (ids.length === 0) return;

        const { error } = await supabaseClient
            .from('orders')
            .update({ status: newStatus, updated_at: new Date().toISOString() })
            .in('id', ids);

        if (error) {
            alert("Erreur lors de la mise à jour groupée");
            return;
        }
        selectedIds.clear();
        await loadOrders();
    }

    // ============================================
    // FILTRES
    // ============================================
    document.getElementById('filterTabs').addEventListener('click', (e) => {
        const tab = e.target.closest('.filter-tab');
        if (!tab) return;
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.status;
        renderOrders();
    });

    // ============================================
    // SESSION EXISTANTE (si déjà connecté)
    // ============================================
    (async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) await initDashboard();
    })();
</script>
</body>
</html>
